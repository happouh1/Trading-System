{
  "webull_version": "3C.2.0",
  "sdk_version": "2.0.17",
  "region_id": "us",
  "api_endpoint": "api.sandbox.webull.com",
  "events_endpoint": "events-api.sandbox.webull.com",
  "credential_environment": {
    "app_key": "WEBULL_APP_KEY",
    "app_secret": "WEBULL_APP_SECRET",
    "account_id": "WEBULL_ACCOUNT_ID"
