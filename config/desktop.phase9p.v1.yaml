{
  "authorization_version": "9P.1.0",
  "mode": "OFFLINE_BACKUP_AUTHORIZATION_EVIDENCE",
  "backup_manifest_config": "config/desktop.phase9o.v1.yaml",
  "policy": {
    "require_phase9o_ready_for_authorization_review": true,
    "require_exact_manifest_hash": true,
