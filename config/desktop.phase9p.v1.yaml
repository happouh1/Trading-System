    "require_operator_nonce": true,
    "review_roles_operator_supplied": true,
    "distinct_reviewer_principals": true,
    "signature_algorithm": "Ed25519",
    "bounded_authorization_window": true
  },
  "authority": {
    "execution_authority_enabled": false,
    "backup_creation_enabled": false,
    "directory_creation_enabled": false,
    "database_write_enabled": false,
    "migration_execution_enabled": false,
    "restore_execution_enabled": false,
    "process_launch_enabled": false,
    "network_enabled": false,
    "credential_loading_enabled": false,
    "broker_writes_enabled": false,
    "sandbox_execution_enabled": false,
    "live_trading_enabled": false
  }
}
